# Generated by the harness bootstrap stage. Replace the setup step for your runtime.
name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Runtime setup — pick the one for the stack, pinned to the version file:
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # - uses: actions/setup-python@v5
      #   with: { python-version-file: .python-version }
      - name: Install
        run: <commands.install>
      - name: Verify
        run: <commands.verify>
